# Site-wide settings. Everything else lives in data/.

# The site name. Change it here and every page follows.
name: Spark Plug
tagline: Capability rankings for DGX Spark owners

repo: https://github.com/Arachnid/spark-index

# The path the site is served under, for local builds. The deploy workflow
# overrides it with the path GitHub Pages reports, so it follows a custom domain.
base_path: /spark-index/

# Cluster sizes the leaderboard offers.
spark_counts: [1, 2, 3, 4]

ranking:
  # A recipe needs scores that count on at least this share of a
  # category's benchmarks to be ranked in that category.
  min_coverage: 0.5
  # On the speed and score frontier, recipes whose decode speeds are within
  # this share of each other count as equally fast, so the higher score wins:
  # each recipe's author measures its speed on their own workload.
  speed_tolerance: 0.1

# Benchmark categories, in display order. Each benchmark lists the
# categories it belongs to.
categories:
  - id: maths
    name: Maths and reasoning
  - id: knowledge
    name: Knowledge
  - id: instructions
    name: Instructions and long context
  - id: tools
    name: Tool calling
