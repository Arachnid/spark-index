# WORKER (WORKER2, WORKER3) from scripts/local.sh, or --env. Four Sparks are
# the ring launcher; on a switch, use ./start-tp4.sh instead. At four Sparks
# the workers read the weights over NFS (WORKER_WEIGHTS=nfs and its NFS_*
# settings). The start scripts download and build what is missing.
start:
  2: ./start.sh
  4: ./start-tp4-switchless.sh
stop:
  2: ./stop.sh
  4: ./stop-tp4.sh
