      19% of replies were identical (70% of tool calls, about a third of code and maths, no prose or JSON), the rest
      first differing at a median of 13 tokens. Fidelity can't be measured: the server returns no prompt
      log-probabilities. Data: runs/qwen3.8-flash-next-fp4-1x-tensorfold/quality/20261115T134341Z.
