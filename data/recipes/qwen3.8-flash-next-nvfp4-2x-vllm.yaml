model: qwen3.8-flash-next
build: nvidia-nvfp4
title: Qwen3.8-Flash-Next NVFP4 on two DGX Sparks (vLLM)
author: Mia's AI Lab, based on getrefined's recipe
url: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks
install:
  label: Get the recipe on GitHub
  url: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks
engine: vLLM (NVIDIA dev build in vllm/vllm-openai:qwen38-flash-next), tensor and expert parallel
sparks: [2]
commands: |
  cp .env.sample .env
  ./download.sh
  ./start.sh --no-download
speeds:
  - sparks: 2
    decode_tps: 56.8
    workload: one request, 600-token prose, MTP3, sparkDash
    source: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks
    date: "2026-09-11"
