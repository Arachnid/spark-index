model: deepseek-v4-flash-vision-exp
build: release
title: DeepSeek V4 Flash Vision-Exp DSpark on 2x DGX Spark
author: Mia's AI Lab (packaging), Tony D
url: https://github.com/MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark
install:
  label: Get the recipe on GitHub
  url: https://github.com/MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark
engine: vLLM on the Anemll 0.1.1 runtime (ghcr.io/anemll/dspark-vllm-gx10:0.1.1), tensor parallel
sparks: [2, 3]
commands: |
  cp .env.dspark.example .env.dspark
  docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1
  ./prepare-dspark-model-cache.sh --official
  ./start-deepseek-v4-flash-dspark.sh   # ./start-tp3.sh for 3 Sparks
notes: Runs DeepSeek's official Vision-Exp weights, pinned to revision 86f746b. Images only, no video.
speeds:
  - sparks: 2
    decode_tps: 56
    workload: one request, 256-token prompt, median of 8 trials
    source: https://github.com/MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark
    date: "2026-09-02"
