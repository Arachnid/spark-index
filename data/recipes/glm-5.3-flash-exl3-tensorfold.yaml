model: glm-5.3-flash
build: mia-exl3-4bpw
title: GLM 5.3 Flash on two or four DGX Sparks, with TensorFold
author: Mia's AI Lab
url: https://github.com/MiaAI-Lab/GLM-5.3-Flash-DGX-Sparks-1104
install:
  label: Get the recipe on GitHub
  url: https://github.com/MiaAI-Lab/GLM-5.3-Flash-DGX-Sparks-1104
engine: TensorFold 1.1.9 native engine (commit f350cd3e) with 121 recipe patches, tensor parallel over ConnectX-7
sparks: [2, 4]
experimental: [4]
version: "1104"
updated: "2026-11-11"
commands: |
  git clone https://github.com/MiaAI-Lab/GLM-5.3-Flash-DGX-Sparks-1104.git
  cd GLM-5.3-Flash-DGX-Sparks-1104
  cp scripts/local.sh.example scripts/local.sh   # set WORKER (WORKER2, WORKER3) in it
  ./start.sh                                     # 2 Sparks
  ./start-tp4-switchless.sh                      # 4 Sparks on a ring
notes: Version 1104 replaces the earlier Python-engine recipe (GLM-5.3-Flash-EXL3-2x-DGX-Sparks-TensorFold) and serves checkpoint revision 76c0b517. Dense weights are served at 8 bits by default (DENSE=q8). The optional DFlash2 drafter is non-commercial (CC BY-NC-ND 4.0); DRAFTER=mtp avoids it. ABLIT=1 serves Mia's abliterated weights, a different build.
speeds:
  - sparks: 2
    decode_tps: 47.8
    prefill_tps: 1801
    prefill_prompt: 32k tokens
    ttft_ms: 200
    workload: one request, prose, temperature 0.7, thinking on, sparkDash
    source: https://github.com/MiaAI-Lab/GLM-5.3-Flash-DGX-Sparks-1104#performance
    date: "2026-11-04"
  - sparks: 4
    decode_tps: 77.2
    prefill_tps: 1879.9
    prefill_prompt: 32k tokens
    ttft_ms: 128
    workload: one request, prose, temperature 0.7, thinking on, top_k 20, switchless ring
    source: https://github.com/MiaAI-Lab/GLM-5.3-Flash-DGX-Sparks-1104#performance-at-four-sparks
    date: "2026-11-11"
