model: qwen3.8-27b
build: radixark-nvfp4
title: Qwen3.8 27B on SGLang for DGX Spark
author: Mia's AI Lab
url: https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark
install:
  label: Get the recipe on GitHub
  url: https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark
engine: SGLang (lmsysorg/sglang:qwen38-27b), DSpark, MTP or DFlash2 speculative decoding
sparks: [1]
